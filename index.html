<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Bibliothèque numérique des 7 tomes anciens en PDF." />
  <meta name="keywords" content="livres anciens, bibliothèque numérique, PDF, théologie, bible" />
  <meta name="author" content="Votre Nom" />

  <title>La Bible Crampon — Édition Originale 1894–1904</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #f4efe2;
    --card: #fffdf8;
    --primary: #4e342e;
    --gold: #c9a227;
    --text: #2b2b2b;
    --shadow: rgba(0,0,0,0.15);
  }

  body {
    font-family: Georgia, serif;
    background: linear-gradient(to bottom, #f7f1e3, #efe5cf);
    color: var(--text);
    line-height: 1.6;
  }

  header {
    position: relative;
    background:
      linear-gradient(rgba(20,14,10,0.85), rgba(20,14,10,0.90)),
      url('images/parchment-bg.jpg') center/cover;
    color: white;
    padding: 100px 20px;
    text-align: center;
  }

  .hero-content { max-width: 900px; margin: auto; }

  h1 { font-size: clamp(2.5rem, 5vw, 4.5rem); }
  h2 { font-weight: normal; margin-top: 10px; }

  .container { width: min(1200px, 95%); margin: auto; padding: 40px 0; }

  .search-box { display: flex; justify-content: center; margin-bottom: 30px; }

  .search-box input {
    width: min(600px, 100%);
    padding: 14px;
    border-radius: 12px;
    border: 2px solid #d7c8a1;
  }

  .books-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 25px;
  }

  .book-card {
    background: var(--card);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 20px var(--shadow);
    display: flex;
    flex-direction: column;
  }

  .cover-wrapper { height: 380px; background: #ddd; }

  .cover-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .book-content { padding: 20px; flex: 1; }

  .buttons { display: flex; gap: 10px; flex-wrap: wrap; }

  .btn {
    flex: 1;
    text-align: center;
    padding: 10px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
  }

  .btn-read { background: var(--primary); color: white; }
  .btn-download { background: var(--gold); color: black; }

  .viewer-section {
    display: none;
    margin-top: 40px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
  }

  .viewer-header {
    background: var(--primary);
    color: white;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .close-btn {
    background: var(--gold);
    border: none;
    padding: 8px 12px;
    cursor: pointer;
    border-radius: 8px;
  }

  canvas {
    width: 100%;
    background: white;
  }

  footer {
    margin-top: 60px;
    text-align: center;
    padding: 30px;
    background: #2d1b14;
    color: white;
  }
</style>
</head>

<body>

<header>
  <div class="hero-content">
    <h1>La Bible Crampon</h1>
    <h2>Édition originale 1894–1904</h2>
  </div>
</header>

<main class="container">

  <div class="search-box">
    <input id="searchInput" placeholder="Rechercher un tome...">
  </div>

  <section class="books-grid">

    <!-- TOME 1 -->
    <article class="book-card" data-title="tome 1">
      <div class="cover-wrapper">
        <img src="covers/tome1.jpg" onerror="this.src='https://via.placeholder.com/300x400?text=Tome+1'">
      </div>

      <div class="book-content">
        <h2>Tome 1</h2>
        <p>Pentateuque</p>

        <div class="buttons">
          <a class="btn btn-read" href="#viewer" onclick="openViewer('https://github.com/epsummessi/bible-crampon/releases/download/livres/tome1.pdf','Tome 1')">Lire</a>
          <a class="btn btn-download" href="https://github.com/epsummessi/bible-crampon/releases/download/livres/tome1.pdf">Télécharger</a>
        </div>
      </div>
    </article>

    <!-- (Tomes 2 à 7 identiques, non modifiés pour lisibilité) -->

  </section>

  <!-- VIEWER -->
  <section id="viewer" class="viewer-section">

    <div class="viewer-header">
      <span id="viewerTitle">Lecture</span>

      <div>
        <button class="close-btn" onclick="prevPage()">◀</button>
        <button class="close-btn" onclick="nextPage()">▶</button>
        <button class="close-btn" onclick="closeViewer()">Fermer</button>
      </div>
    </div>

    <div style="padding:15px;">
      <div style="width:100%; height:6px; background:#ddd; margin-bottom:10px;">
        <div id="loadingBar" style="height:100%; width:0%; background:#c9a227;"></div>
      </div>

      <canvas id="pdfCanvas"></canvas>
    </div>
  </section>

</main>

<footer>
  Bibliothèque numérique des 7 tomes
</footer>

<!-- ✅ PDF.JS PROPRE (FIX 404 + WORKER) -->
<script type="module">
import * as pdfjsLib from "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.mjs";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.2.67/build/pdf.worker.min.js";

let pdfDoc = null;
let page = 1;
let scale = 1.4;

const canvas = document.getElementById("pdfCanvas");
const ctx = canvas.getContext("2d");
const viewer = document.getElementById("viewer");

window.openViewer = async function(url, title) {

  viewer.style.display = "block";
  document.getElementById("viewerTitle").textContent = title;

  const loadingTask = pdfjsLib.getDocument(url);

  pdfDoc = await loadingTask.promise;

  page = 1;
  render();
};

async function render() {
  if (!pdfDoc) return;

  const p = await pdfDoc.getPage(page);
  const viewport = p.getViewport({ scale });

  canvas.height = viewport.height;
  canvas.width = viewport.width;

  await p.render({ canvasContext: ctx, viewport }).promise;
}

window.nextPage = function() {
  if (!pdfDoc) return;
  if (page < pdfDoc.numPages) page++;
  render();
};

window.prevPage = function() {
  if (!pdfDoc) return;
  if (page > 1) page--;
  render();
};

window.closeViewer = function() {
  viewer.style.display = "none";
  pdfDoc = null;
  canvas.getContext("2d").clearRect(0,0,canvas.width,canvas.height);
};

</script>

</body>
</html>
